table: users
description: One row per registered BEAM user. Holds the signup date, the user's country group and device type.

fields:
  - name: user_id
    type: integer
    description: Unique ID of the user.
    role: entity

  - name: signup_date
    type: timestamp
    description: Date and time the user signed up. Some rows carry midnight times and others real times, so compare on the date, not the full timestamp. September 2025 has about five times the signups of a normal month. This is a known anomaly, so call it out whenever it enters a comparison.
    role: dimension

  - name: country
    type: text
    description: Country group of the user, based on IP geolocation at signup. One of US, EU, India or Rest. EU and Rest are groups, not single countries. Rest holds every other country.
    role: dimension

  - name: device_type
    type: text
    description: Device the user used to sign up. One of Web, Android or iOS. Values are case sensitive, for example 'iOS' not 'ios'.
    role: dimension

measures:
  - name: total_users
    formula: COUNT(user_id)
    description: Number of users, with no time anchor. Use it for all registered users.

  - name: signups
    formula: COUNT(user_id)
    description: Number of users who signed up in the period, counted on signup_date. Use it for any question about new users over time, and call out the September 2025 spike when it is in the period.

golden_queries:
  - name: users_by_country
    description: Number of users in each country group
    sql: |
      SELECT country, COUNT(*) AS total_users
      FROM users
      GROUP BY country
      ORDER BY total_users DESC;

  - name: signups_by_month
    description: Number of users who signed up each month. September 2025 is the known signup spike, about five times a normal month.
    sql: |
      SELECT DATE_TRUNC('month', signup_date) AS signup_month, COUNT(*) AS new_users
      FROM users
      GROUP BY 1
      ORDER BY 1;

  - name: active_paid_share_by_country
    description: Share of users in each country group who hold an active paid subscription on the analysis date, 2026-09-24. Starts from users with a LEFT JOIN so users with no subscription stay in the denominator. The start date test sits in the ON clause so subscriptions that have not started are ignored without dropping the user.
    sql: |
      SELECT u.country,
             COUNT(*) AS users,
             COUNT(*) FILTER (WHERE s.plan IN ('monthly', 'annual')
                                AND (s.end_date IS NULL OR s.end_date::date > DATE '2026-09-24')) AS active_paid_users,
             ROUND(COUNT(*) FILTER (WHERE s.plan IN ('monthly', 'annual')
                                      AND (s.end_date IS NULL OR s.end_date::date > DATE '2026-09-24'))::numeric / COUNT(*), 4) AS paid_share
      FROM users u
      LEFT JOIN subscriptions s
        ON s.user_id = u.user_id
       AND s.start_date::date <= DATE '2026-09-24'
      GROUP BY u.country
      ORDER BY paid_share DESC;
