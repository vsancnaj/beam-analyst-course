table: subscriptions
description: One row per user's subscription. Each user has at most one row, so plan changes are not kept as history. Churn is always read from end_date, never from status.

fields:
  - name: subscription_id
    type: integer
    description: Unique ID of the subscription.
    role: entity

  - name: user_id
    type: integer
    description: User who owns the subscription. Each user has at most one subscription.
    role: relationship
    related_table: users
    related_field: user_id

  - name: plan
    type: text
    description: The current subscription plan. One of free, monthly or annual. Free subscriptions never end and have no end_date, so leave them out of any churn or retention calculation. Because plan changes are not kept as history, upgrades and downgrades cannot be analysed from this table.
    role: dimension

  - name: start_date
    type: timestamp
    description: Date when the subscription started. Used to work out tenure. Start dates run up to 2026-10-04. A start_date after the analysis date of 2026-09-24 is a scheduled start that has not happened yet, so leave those rows out of any count of what has happened. On the analysis date that is 1,549 subscriptions (967 free, 425 monthly, 157 annual).
    role: dimension

  - name: end_date
    type: timestamp
    description: Date when the subscription ended or is scheduled to end. Empty means the subscription is active. A date after the analysis date is a scheduled cancellation, and that subscription is still active today. This is the field to read churn from.
    role: dimension

  - name: status
    type: text
    description: Label on the subscription. One of active, expired or canceled. Rows without an end_date are active and rows with one are expired or canceled. The label for ended subscriptions switched from expired to canceled for end dates from August 2026 on, including future scheduled ends, so a subscription labelled canceled may not have ended yet. The label does not separate voluntary cancellations from lapses and does not mean the subscription has already ended, so never read churn from status.
    role: dimension

# Field-level roles above follow the Beam example file.
# This relationships block is an extra we added on top. The key name "relationships" is our choice and is not in the Beam example file.
relationships:
  - name: subscription_to_user
    to: users
    join: subscriptions.user_id = users.user_id
    type: many_to_one
    description: Each subscription belongs to one user. The model allows many subscriptions per user, but today every user has at most one, so plan changes are not kept as history. Some users have no subscription, so use a LEFT JOIN from users when you need all users.

measures:
  - name: churned_subscriptions
    formula: COUNT(subscription_id) FILTER (WHERE plan IN ('monthly', 'annual') AND start_date < period_start AND end_date >= period_start AND end_date < period_end)
    description: Paid subscriptions that were active at the start of the period and whose end_date falls in the period. Churn rates use paid plans only, dividing by paid subscriptions active at the start of the period. period_start and period_end are the window parameters, set them in a params CTE.

  - name: paid_subscriptions_at_period_start
    formula: COUNT(subscription_id) FILTER (WHERE plan IN ('monthly', 'annual') AND start_date < period_start AND (end_date IS NULL OR end_date >= period_start))
    description: Paid subscriptions that were active at the start of the period. This is the denominator for churn rates.

  - name: paid_churn_rate
    formula: ROUND(COUNT(subscription_id) FILTER (WHERE plan IN ('monthly', 'annual') AND start_date < period_start AND end_date >= period_start AND end_date < period_end)::numeric / NULLIF(COUNT(subscription_id) FILTER (WHERE plan IN ('monthly', 'annual') AND start_date < period_start AND (end_date IS NULL OR end_date >= period_start)), 0), 4)
    description: Share of paid subscriptions active at the start of the period that ended during it. Read from end_date, never from status.

  - name: active_subscriptions
    formula: COUNT(subscription_id) FILTER (WHERE start_date::date <= DATE '2026-09-24' AND (end_date IS NULL OR end_date::date > DATE '2026-09-24'))
    description: Subscriptions of any plan that have started and have not ended on the analysis date, 2026-09-24, including those with a scheduled cancellation still ahead. Add plan IN ('monthly', 'annual') to count paid only.

  - name: scheduled_to_cancel_subscriptions
    formula: COUNT(subscription_id) FILTER (WHERE start_date::date <= DATE '2026-09-24' AND end_date::date > DATE '2026-09-24')
    description: Subscriptions that are still active on the analysis date but have an end_date in the future. They are active today and will churn later.

derived_dimensions:
  - name: tenure_band
    description: >
      How long a subscriber had been paying at the start of the period being
      analysed. Beam cuts tenure into these four bands and no others, so that
      groups compare across analyses. Use it with paid plans only, because free
      subscriptions are left out of churn and retention. period_start is the
      window parameter, set it once in a params CTE as paid_churn_by_tenure_band does.
    formula: |
      CASE
        WHEN period_start - start_date < INTERVAL '6 months'  THEN 'under 6 months'
        WHEN period_start - start_date < INTERVAL '12 months' THEN '6 to 12 months'
        WHEN period_start - start_date < INTERVAL '24 months' THEN '12 to 24 months'
        ELSE 'over 24 months'
      END

golden_queries:
  - name: monthly_paid_churn_rate
    description: Monthly churn rate for paid plans, the share of paid subscriptions active at the start of each month that ended during it. Runs January to August 2026 because September is not complete on the analysis date, 2026-09-24. Monthly and annual plans are blended.
    sql: |
      WITH months AS (
        SELECT generate_series(DATE '2026-01-01', DATE '2026-08-01', INTERVAL '1 month')::date AS month_start
      )
      SELECT m.month_start,
             COUNT(*) AS paid_at_month_start,
             COUNT(*) FILTER (WHERE s.end_date < m.month_start + INTERVAL '1 month') AS churned_subscriptions,
             ROUND(COUNT(*) FILTER (WHERE s.end_date < m.month_start + INTERVAL '1 month')::numeric / COUNT(*), 4) AS churn_rate
      FROM months m
      JOIN subscriptions s
        ON s.plan IN ('monthly', 'annual')
       AND s.start_date < m.month_start
       AND (s.end_date IS NULL OR s.end_date >= m.month_start)
      GROUP BY m.month_start
      ORDER BY m.month_start;

  - name: paid_subscriptions_by_plan
    description: Number of paid subscriptions active on the analysis date, 2026-09-24, split by plan, with how many of them have a scheduled cancellation. A subscription counts only if it had started on that date and its end_date is empty or after that date. Free is left out.
    sql: |
      SELECT plan,
             COUNT(*) AS active_paid_subscriptions,
             COUNT(*) FILTER (WHERE end_date IS NOT NULL) AS scheduled_to_cancel
      FROM subscriptions
      WHERE plan IN ('monthly', 'annual')
        AND start_date::date <= DATE '2026-09-24'
        AND (end_date IS NULL OR end_date::date > DATE '2026-09-24')
      GROUP BY plan
      ORDER BY plan;

  - name: paid_churn_by_tenure_band
    description: Six-month churn rate for paid plans by tenure band. Paid subscriptions active at period_start, grouped by the tenure_band formula above, with how many ended within the six months after it. The window start (period_start in the params CTE) is the parameter, change it to move the window.
    sql: |
      WITH params AS (
        SELECT DATE '2026-03-01' AS period_start
      ),
      cohort AS (
        SELECT s.subscription_id,
               s.end_date,
               p.period_start,
               CASE
                 WHEN p.period_start - s.start_date < INTERVAL '6 months'  THEN 'under 6 months'
                 WHEN p.period_start - s.start_date < INTERVAL '12 months' THEN '6 to 12 months'
                 WHEN p.period_start - s.start_date < INTERVAL '24 months' THEN '12 to 24 months'
                 ELSE 'over 24 months'
               END AS tenure_band
        FROM subscriptions s
        CROSS JOIN params p
        WHERE s.plan IN ('monthly', 'annual')
          AND s.start_date < p.period_start
          AND (s.end_date IS NULL OR s.end_date >= p.period_start)
      )
      SELECT tenure_band,
             COUNT(*) AS subscribers_at_start,
             COUNT(*) FILTER (WHERE end_date < period_start + INTERVAL '6 months') AS churned_within_6_months,
             ROUND(COUNT(*) FILTER (WHERE end_date < period_start + INTERVAL '6 months')::numeric / COUNT(*), 4) AS churn_rate
      FROM cohort
      GROUP BY tenure_band
      ORDER BY CASE tenure_band
                 WHEN 'under 6 months'  THEN 1
                 WHEN '6 to 12 months'  THEN 2
                 WHEN '12 to 24 months' THEN 3
                 ELSE 4
               END;
